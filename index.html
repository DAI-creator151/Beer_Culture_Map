<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <title>Ölkulturkartan</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  
  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />

  <!-- Importera Raleway från Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@800&display=swap" rel="stylesheet">

  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    /* Stil på popup-rutan med Raleway ExtraBold och vintage-känsla */
    .mapboxgl-popup-content {
      font-family: 'Raleway', sans-serif;
      padding: 12px 16px;
      border-radius: 8px;
      background-color: #fdfbf7; /* Vintage pergament-bakgrund */
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      max-width: 240px;
    }
    
    /* Titeln på bryggeriet (Raleway ExtraBold, Stora bokstäver, Mörkröd) */
    .popup-title {
      font-family: 'Raleway', sans-serif;
      font-weight: 800; /* ExtraBold */
      text-transform: uppercase; /* Endast stora bokstäver */
      font-size: 15px;
      color: #8b0000; /* Mörkröd för kontrast */
      margin: 0 0 4px 0;
      letter-spacing: 0.5px;
    }

    .popup-city {
      font-size: 12px;
      color: #555;
      font-style: italic;
      margin-bottom: 6px;
    }

    .popup-desc {
      font-size: 13px;
      color: #222;
      margin: 0;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // 1. MAPBOX-INSTÄLLNINGAR
  mapboxgl.accessToken = 'pk.eyJ1IjoiYmVlcmV4cGxvcmVyIiwiYSI6ImNtdTQ1cWNuajAxdWYyd3IzNWwwdjdiZWgifQ.kDZ71LEHkdpRLIzoxvnEjA'; // Klistra in din pk.eyJ... token här

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v12', 
    center: [15.0000, 50.0000], // Centrerat över Centraleuropa (nära Prag
    zoom: 3.5                   // Lägre zoomnivå som visar hela Europa
  });

  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  // 2. HÄMTA BRYGGERIER FRÅN FIRESTORE
  const FIREBASE_PROJECT_ID = 'beerexplorer-9dc7d'; // Ersätt med ditt Firebase Project ID
  
  // OBS: Skiftlägeskänsligt! Se till att 'breweries' matchar namnet i din databas exakt (litet eller stort b)
  const firestoreUrl = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/breweries?pageSize=300`;

  map.on('load', () => {
    fetch(firestoreUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error(`Nätverksfel vid hämtning: ${response.statusText}`);
        }
        return response.json();
      })
      .then(data => {
        if (data.documents && data.documents.length > 0) {
          data.documents.forEach(doc => {
            const fields = doc.fields || {};

            const name = fields.name ? fields.name.stringValue : 'Okänt Bryggeri';
            const city = fields.city ? fields.city.stringValue : '';
            const description = fields.description ? fields.description.stringValue : '';
            
            const latObj = fields.latitude;
            const lngObj = fields.longitude;

            if (latObj && lngObj) {
              const lat = parseFloat(latObj.doubleValue || latObj.integerValue);
              const lng = parseFloat(lngObj.doubleValue || lngObj.integerValue);

              if (!isNaN(lat) && !isNaN(lng)) {
                const popupHTML = `
                  <div class="popup-title">${name}</div>
                  ${city ? `<div class="popup-city">${city}</div>` : ''}
                  ${description ? `<div class="popup-desc">${description}</div>` : ''}
                `;

                new mapboxgl.Marker({ color: '#8b0000' })
                  .setLngLat([lng, lat])
                  .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(popupHTML))
                  .addTo(map);
              }
            }
          });
        } else {
          alert("Firestore skickade " + (data.documents?.length || 0) + " bryggerier");

    if (data.documents && data.documents.length > 0) {
        }
      })
      .catch(error => {
        console.error('Ett fel uppstod vid inläsning av bryggerier:', error);
      });
  });
</script>

</body>
</html>
