<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kulturöls-Karta</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Georgia, serif; }
        #map { width: 100%; height: 100%; }
        .mapboxgl-popup-content { background-color: #fdfbf7; border: 1px solid #8b7d6b; border-radius: 6px; color: #2c221e; font-family: Georgia, serif; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYmVlcmV4cGxvcmVyIiwiYSI6ImNtdTQ1cWNuajAxdWYyd3IzNWwwdjdiZWgifQ.kDZ71LEHkdpRLIzoxvnEjA';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [14.3, 56.6],
        zoom: 6.5
    });

    map.addControl(new mapboxgl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true
    }), 'top-right');

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    const urlParams = new URLSearchParams(window.location.search);
    const lat = parseFloat(urlParams.get('lat'));
    const lng = parseFloat(urlParams.get('lng'));
    const title = urlParams.get('title');

    if (!isNaN(lat) && !isNaN(lng)) {
        map.on('load', () => {
            map.flyTo({ center: [lng, lat], zoom: 12 });
            new mapboxgl.Marker({ color: '#8b0000' })
                .setLngLat([lng, lat])
                .setPopup(new mapboxgl.Popup({ offset: 25 }).setHTML(`<h3>${title || 'Historiskt Bryggeri'}</h3>`))
                .addTo(map);
        });
    }
</script>
</body>
</html>
